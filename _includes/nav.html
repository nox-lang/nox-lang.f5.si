<nav class="site-nav" id="site-nav">
  <div class="container site-nav__bar">
    <a href="{{ '/' | relative_url }}" class="site-nav__brand">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="">
      Nox
    </a>

    <div class="site-nav__links">
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </div>

    <div class="site-nav__actions">
      <a class="site-nav__search plain" href="{{ '/search/' | relative_url }}" aria-label="検索">
        {% include icon-search.html %}
        <span>検索…</span>
        <kbd>/</kbd>
      </a>
      <a class="site-nav__gh plain" href="{{ site.github_repo }}">
        {% include icon-github.html %}
        <span>GitHub</span>
      </a>
      <button class="site-nav__toggle" id="nav-toggle" aria-label="メニュー" aria-expanded="false">
        {% include icon-menu.html %}
      </button>
    </div>
  </div>
</nav>
