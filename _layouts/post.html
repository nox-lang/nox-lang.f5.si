---
layout: default
---
<div class="container">
  <div class="post-hero">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%-m月%-d日" }}</time>
    <h1>{{ page.title }}</h1>
    {% if page.tags %}
    <div class="tags">
      {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    </div>
    {% endif %}
  </div>
</div>
<div class="container prose-page">
  <div class="prose">
    {{ content }}
  </div>
</div>
